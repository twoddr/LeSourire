spring:
  application:
    name: lesourire-serveur

  datasource:
    url: ${LESOURIRE_BD_URL:jdbc:mariadb://localhost:3306/lesourire}
    username: ${LESOURIRE_BD_UTILISATEUR:admin}
    password: ${LESOURIRE_BD_MOT_DE_PASSE:csa-soft}

  jpa:
    hibernate:
      # Le schéma est géré exclusivement par Flyway ; Hibernate vérifie seulement
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration

server:
  port: ${LESOURIRE_PORT:8420}
  error:
    # Remonte les messages métier (ResponseStatusException) jusqu'au client
    include-message: always

lesourire:
  # Chiffrement au repos des données sensibles (AES-256-GCM).
  # - cle : clé en base64 (16/24/32 octets). Vide = lecture (ou création) du
  #   fichier ci-dessous.
  # - fichier : emplacement de la clé lorsque l'environnement n'en fournit pas.
  # La clé DOIT être sauvegardée avec la base : sans elle, les données
  # (identité et dossier médical des patients) sont définitivement illisibles.
  chiffrement:
    cle: ${LESOURIRE_CHIFFREMENT_CLE:}
    fichier: ${LESOURIRE_CHIFFREMENT_FICHIER:fichiers/cle-chiffrement.key}

  # Notifications aux patients (confirmation de RDV, rappel la veille).
  # Les réglages métier (activation, fournisseur, expéditeur…) vivent dans la
  # table `parametre` et se modifient depuis Administration → Paramètres.
  notification:
    # Boucle du planificateur : toutes les minutes, premier passage après 30 s.
    intervalle-ms: ${LESOURIRE_NOTIFICATION_INTERVALLE_MS:60000}
    delai-initial-ms: ${LESOURIRE_NOTIFICATION_DELAI_INITIAL_MS:30000}
    # Pause entre deux SMS : l'API Orange accepte 5 envois par seconde.
    pause-ms: ${LESOURIRE_NOTIFICATION_PAUSE_MS:250}
    orange:
      # Identifiants de l'application déclarée sur developer.orange.com.
      # JAMAIS en base : la table `parametre` n'est pas chiffrée.
      client-id: ${LESOURIRE_ORANGE_CLIENT_ID:}
      client-secret: ${LESOURIRE_ORANGE_CLIENT_SECRET:}
      # Adresse d'expédition contractualisée : nom whitelisté (« CABINET LE
      # SOURIRE ») ou, si vous envoyez depuis une carte SIM Orange,
      # « tel:+237XXXXXXXXX ». Vide = paramètre `notification.nom_expediteur`.
      expediteur: ${LESOURIRE_ORANGE_EXPEDITEUR:}
      url-token: ${LESOURIRE_ORANGE_URL_TOKEN:https://api.orange.com/oauth/v3/token}
      url-envoi: ${LESOURIRE_ORANGE_URL_ENVOI:https://api.orange.com/smsmessaging/v1/outbound/%s/requests}

logging:
  file:
    # Renseigné par les lanceurs (LESOURIRE_LOG) : sans valeur, pas de fichier.
    name: ${LESOURIRE_LOG:}
  level:
    com.lesourire: INFO
